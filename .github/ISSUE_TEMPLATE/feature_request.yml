name: Feature Request
description: Suggest an idea for NanDark
title: "[FEATURE] "
labels: ["feature"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide clear context.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the problem this feature would solve
      placeholder: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Have you considered other solutions?
      placeholder: Other approaches...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Use Case
      description: Why is this feature important?
      placeholder: User story or use case...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing features
          required: true
        - label: This aligns with our privacy-first philosophy
          required: false
        - label: I am willing to help implement this
          required: false
